name: Setup Dependencies
description: Install the apt packages required to build VCML on Ubuntu runners

inputs:
  extra:
    description: Additional space-separated apt packages to install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get update -y -q
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
          libelf-dev libsdl2-dev liblua5.3-dev libslirp-dev libusb-1.0-0-dev ninja-build ${{ inputs.extra }}
