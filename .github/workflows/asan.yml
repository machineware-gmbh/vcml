name: asan

on:
  push:
    branches:
      - 'main'
      - 'dev**'

env:
  TARGET_ARCH: linux64
  ASAN_OPTIONS: verbosity=1
  TSAN_OPTIONS: verbosity=1
  UBSAN_OPTIONS: print_stacktrace=1

jobs:
  sanitize:
    runs-on: ubuntu-26.04
    name: ${{matrix.sanitizer}}

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN, UBSAN]
      
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup Dependencies
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install libelf-dev libsdl2-dev liblua5.3-dev libslirp-dev libusb-1.0-0-dev ninja-build

    - name: Configure
      run: cmake -G Ninja -B BUILD -DCMAKE_BUILD_TYPE=${{matrix.sanitizer}} -DVCML_BUILD_TESTS=ON

    - name: Build
      run: cmake --build BUILD

    - name: Test
      working-directory: BUILD
      run: ctest --output-on-failure

    - name: Upload Logs
      uses: actions/upload-artifact@v7
      if: '!cancelled()'
      with:
        name: ${{github.event.repository.name}}-logs-${{matrix.sanitizer}}
        path: |
            BUILD/.ninja_log
            BUILD/CMakeCache.txt
            BUILD/Testing/Temporary/LastTest.log
        include-hidden-files: true
        retention-days: 7
